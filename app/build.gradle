apply plugin: 'com.android.application'

android {
    namespace 'com.kaspar.tuhat'
    compileSdk 37

    def stringsFile = file("src/main/res/values/strings.xml")
    def xml = new groovy.xml.XmlParser().parse(stringsFile)
    def verName = xml.string.find { it.'@name' == 'version_name' }.text()
    def verCode = xml.string.find { it.'@name' == 'version_code' }.text().toInteger()

    defaultConfig {
        applicationId "com.kaspar.tuhat"
        minSdk 34
        targetSdk 37
        versionCode verCode
        versionName verName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/INDEX.LIST'
            ]
        }
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.gson
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
